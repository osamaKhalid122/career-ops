# Portal Scanner Configuration
# Tailored for: Osama Khalid — Senior Embedded Firmware Engineer
# Target: Netherlands / Europe — Defence, Semiconductor, Embedded Systems
#
# Strategy (3 levels):
#   1. Playwright → careers_url of each company (real-time, reliable)
#   2. Greenhouse API → structured JSON (fast, Greenhouse-only)
#   3. WebSearch with site: filters (broad discovery, may be stale)

# -- Title filter --
title_filter:
  positive:
    # -- Core embedded/firmware roles --
    - "Embedded"
    - "Firmware"
    - "FPGA"
    - "RTOS"
    - "Real-Time"
    - "Real Time"
    - "Bare Metal"
    - "Microcontroller"
    - "MCU"
    - "SoC"
    - "Zynq"
    - "ARM"
    - "Cortex"
    # -- C/C++ software engineering --
    - "C++ Engineer"
    - "C++ Developer"
    - "C++ Software"
    - "Software Engineer C++"
    - "Systems Engineer"
    - "Systems Software"
    - "Platform Engineer"
    # -- Hardware-adjacent --
    - "Hardware Engineer"
    - "Electronics Engineer"
    - "PCB"
    - "BSP"
    - "Board Support"
    - "Device Driver"
    - "Linux Driver"
    - "Embedded Linux"
    # -- Defence / optronics --
    - "Defence"
    - "Defense"
    - "Naval"
    - "Radar"
    - "Sensor"
    - "Optronics"
    - "Electro-Optical"
    - "EO/IR"
    - "Thermal"
    - "Surveillance"
    - "Fire Control"
    - "Command System"
    # -- Semiconductor / chip --
    - "Semiconductor"
    - "Lithography"
    - "Wafer"
    - "IC Design"
    - "Chip"
    - "Silicon"
    # -- CI/CD and tooling for embedded --
    - "Build Engineer"
    - "DevOps Embedded"
    - "Test Engineer"
    - "Verification Engineer"
    - "Validation Engineer"
    # -- Robotics --
    - "Robotics"
    - "ROS"
    - "Robot Software"
    - "Motion Control"
    - "Controls Engineer"
    # -- German keywords (for DACH market) --
    - "Softwareentwickler"
    - "Entwicklungsingenieur"
    - "Systemingenieur"
    - "Regelungstechnik"
  negative:
    # Roles to exclude
    - "Intern"
    - "Werkstudent"
    - "Trainee"
    - "Web Developer"
    - "Frontend"
    - "React"
    - "Angular"
    - "iOS"
    - "Android"
    - "PHP"
    - "Ruby"
    - "Salesforce Admin"
    - "SAP "
    - "Oracle EBS"
    - "Mainframe"
    - "COBOL"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "UX Designer"
    - "UI Designer"
    - "Marketing"
    - "Content Writer"
  seniority_boost:
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head"
    - "Sr."
    - "Sr "

# -- Search queries --
search_queries:

  # ══════════ Netherlands — Embedded/Firmware ══════════

  - name: LinkedIn NL — Embedded Firmware
    query: 'site:linkedin.com/jobs "Embedded" OR "Firmware" "Engineer" Netherlands'
    enabled: true

  - name: LinkedIn NL — C++ Real-Time
    query: 'site:linkedin.com/jobs "C++" "Real-Time" OR "RTOS" OR "FreeRTOS" Netherlands'
    enabled: true

  - name: LinkedIn NL — FPGA Zynq
    query: 'site:linkedin.com/jobs "FPGA" OR "Zynq" OR "Vivado" OR "VHDL" Netherlands'
    enabled: true

  - name: Indeed NL — Embedded Engineer
    query: 'site:indeed.nl "Embedded Software Engineer" OR "Firmware Engineer" OR "C++ Engineer"'
    enabled: true

  - name: Indeed NL — Defence Systems
    query: 'site:indeed.nl "Defence" OR "Defense" "Software Engineer" OR "Systems Engineer"'
    enabled: true

  # ══════════ Netherlands — Defence Sector ══════════

  - name: Thales NL — All Engineering
    query: 'site:careers.thalesgroup.com Netherlands "Engineer" OR "Software" OR "C++"'
    enabled: true

  - name: Thales NL — Defence Systems
    query: 'site:careers.thalesgroup.com Hengelo OR Netherlands "Embedded" OR "Firmware" OR "FPGA" OR "Radar" OR "Naval"'
